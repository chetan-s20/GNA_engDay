[project]
name = "nyc-airbnb-market-intelligence"
version = "0.1.0"
description = "Interactive NYC Airbnb market analysis for the GNA Engineering Day DataViz Hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.24",
    "seaborn>=0.13",
    "streamlit>=1.39",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
